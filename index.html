<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f23;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .loader {
      text-align: center;
    }
    .loader-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #4f8cff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #4f8cff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .status {
      font-size: 13px;
      color: #666;
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
    }
    .hint {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-icon"></div>
    <div class="title">DeepSeek Harness</div>
    <div class="subtitle">正在连接本地 DSH 服务...</div>
    <div class="status" id="status">检测中...</div>
  </div>
  <div class="hint">点击关闭按钮将最小化到系统托盘</div>

  <script>
    const DSH_URL = 'http://127.0.0.1:3080';
    const statusEl = document.getElementById('status');
    let attempts = 0;

    async function checkDSH() {
      attempts++;
      statusEl.textContent = `检测 DSH 服务状态... (尝试 ${attempts})`;

      try {
        const resp = await fetch(DSH_URL, { method: 'HEAD', mode: 'no-cors' });
        // 如果请求没有抛异常，认为服务已启动
        statusEl.textContent = 'DSH 服务已就绪，正在跳转...';
        window.location.href = DSH_URL;
      } catch (e) {
        statusEl.textContent = `DSH 未就绪，等待中... (${attempts})`;
        setTimeout(checkDSH, 1500);
      }
    }

    // 开始检测
    checkDSH();
  </script>
</body>
</html>
