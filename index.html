<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f23;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .loader {
      text-align: center;
    }
    .loader-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #4f8cff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #4f8cff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .status {
      font-size: 13px;
      color: #666;
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
    }
    .hint {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #444;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-icon"></div>
    <div class="title">DeepSeek Harness</div>
    <div class="subtitle">正在启动本地 DSH 服务...</div>
    <div class="status" id="status">请稍候，启动完成后将自动进入主界面</div>
  </div>
  <div class="hint">
    点击关闭按钮将最小化到系统托盘<br />
    DSH 0.1.6 起默认启用 token 认证，若长时间停留在本页面，<br />
    请从托盘右键菜单「重启 DSH 服务」重试
  </div>

  <!--
    本页面只负责加载动画，不做任何服务探测、也不改写 window.location。
    所有窗口导航统一由 Rust 侧 load_dsh_ui() 负责（它会带上 ?token=xxx 完整地址），
    避免前端与后端同时改写 location 互相打断。
  -->
</body>
</html>
